[package]
name = "defingerprinter"
version = "1.0.0"
edition = "2024"
description = "Offline native PII redaction with a stable C ABI"
authors = ["Jack Chakany <jack@chakany.systems>"]
publish = false
license = "MIT AND CC-BY-4.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["tract"]
ort = ["dep:ort"]
tract = ["dep:tract-onnx"]
tract-expanded = ["tract"]

[[example]]
name = "tract_compare"
required-features = ["tract", "ort"]

[[example]]
name = "tract_profile"
required-features = ["tract"]

[[example]]
name = "pii_eval"
required-features = ["tract", "ort"]

[dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic", "api-22"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-general-category = "1"
tract-onnx = { version = "=0.23.8", optional = true }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Test binaries do not ship. Dropping fat LTO keeps the check-phase link time
# and peak memory inside hosted runner limits.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"
